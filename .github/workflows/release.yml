name: Release

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag to publish under"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
      dry-run:
        description: "Validate and build only — do not publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Validate package version and dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ inputs.dist-tag }}"
          echo "package version: $VERSION"
          echo "dist-tag:        $TAG"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version."
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=1 ;;
            *)   PRERELEASE=0 ;;
          esac
          if [ "$TAG" = "latest" ] && [ "$PRERELEASE" = "1" ]; then
            echo "::error::Refusing to publish prerelease '$VERSION' under the 'latest' dist-tag."
            exit 1
          fi
          if [ "$TAG" != "latest" ] && [ "$PRERELEASE" = "0" ]; then
            echo "::warning::Publishing a stable version '$VERSION' under a prerelease dist-tag '$TAG'."
          fi

      - name: Verify (lint + typecheck + tests)
        run: npm run verify

      - name: Build the library
        run: npm run build:lib

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --tag "${{ inputs.dist-tag }}" --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --tag "${{ inputs.dist-tag }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
